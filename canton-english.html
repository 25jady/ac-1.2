<title>Canton English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a trade-fair visitor badge on top (level, countdown, XP), then four tabs.
   Lessons run full screen as a focused overlay. Jade is the only accent; marigold marks XP. */
:root {
  --bg: #eaf0ee;
  --surface: #ffffff;
  --surface-2: #f3f7f5;
  --ink: #12201c;
  --muted: #566862;
  --line: #d2dcd8;
  --accent: #0a7a5b;
  --accent-ink: #ffffff;
  --xp: #e0a21a;
  --good: #167a43;
  --bad: #c2362d;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1614; --surface: #15211e; --surface-2: #1b2a26; --ink: #e7f1ee; --muted: #93a9a2;
    --line: #283a35; --accent: #3fcf9c; --accent-ink: #06231a; --xp: #f1b84a; --good: #4cd68a; --bad: #ff7b6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1614; --surface: #15211e; --surface-2: #1b2a26; --ink: #e7f1ee; --muted: #93a9a2;
  --line: #283a35; --accent: #3fcf9c; --accent-ink: #06231a; --xp: #f1b84a; --good: #4cd68a; --bad: #ff7b6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--font-mono); letter-spacing: .04em; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 112px; display: flex; flex-direction: column; gap: 20px; }

/* Badge */
.badge { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 18px 16px; position: relative; display: flex; flex-direction: column; gap: 14px; }
.badge::before { content: ""; position: absolute; top: 9px; left: 50%; width: 54px; height: 9px; margin-left: -27px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.b-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wordmark { font-family: var(--font-display); font-variation-settings: "wdth" 120; font-weight: 800; font-size: 1.05rem; letter-spacing: .01em; }
.pass { font-size: .72rem; color: var(--muted); }
.b-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.rank { font-size: .72rem; color: var(--muted); text-transform: uppercase; }
.badge h1 { font-family: var(--font-display); font-variation-settings: "wdth" 115; font-weight: 800; font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.05; text-wrap: balance; }
.count { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.count b { font-family: var(--font-display); font-variation-settings: "wdth" 100; font-size: 2.3rem; line-height: 1; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.count span { font-size: .8rem; color: var(--muted); }
.xpbar, .bar { height: 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.xpbar i, .bar i { display: block; height: 100%; background: var(--xp); border-radius: 6px; transition: width .4s; }
.bar i { background: var(--accent); }
.xpl { font-size: .74rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }

/* Generic */
.sec-title { font-family: var(--font-display); font-variation-settings: "wdth" 110; font-weight: 800; font-size: 1.25rem; text-wrap: balance; }
.sub { color: var(--muted); font-size: .95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; min-height: 48px; }
.btn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 600; text-align: left; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Goal */
.goal { flex-direction: row; align-items: center; gap: 14px; }
.goal .bar { flex: 1; }
.goal strong { font-variant-numeric: tabular-nums; }

/* Units */
.unit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.unit-head h3 { font-family: var(--font-display); font-variation-settings: "wdth" 108; font-weight: 800; font-size: 1.15rem; }
.unit-n { font-size: .74rem; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 4px; font-weight: 600; font-size: .88rem; min-height: 44px; }
.chip.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.next { border: 2px solid var(--accent); }
.tag { font-size: .72rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }

/* Media */
.item { display: flex; flex-direction: column; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; padding-top: 0; }
.item-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.item-h h3 { font-size: 1.02rem; font-weight: 700; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.check label { flex: 1; min-width: 0; }
ol.steps { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

/* Glossary */
.search { width: 100%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; min-height: 48px; }
.phrase { display: flex; gap: 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
.phrase:first-child { border-top: 0; }
.phrase > div { flex: 1; min-width: 0; }
.phrase .en { font-weight: 600; }
.phrase .pt { color: var(--muted); font-size: .92rem; }
.phrase .u { font-size: .7rem; color: var(--muted); }

/* Speaker */
.spk { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); display: grid; place-items: center; flex: none; }
.spk.big { width: 84px; height: 84px; }
.spk.big svg { width: 38px; height: 38px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.tabs div { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab { border: 0; background: none; padding: 10px 2px; border-radius: 10px; font-weight: 600; font-size: .9rem; color: var(--muted); min-height: 48px; }
.tab[aria-current="page"] { color: var(--accent); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }

/* Run overlay */
#run { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.run-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 720px; width: 100%; margin: 0 auto; }
.run-top .bar { flex: 1; }
.x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; line-height: 1; }
.run-body { flex: 1; overflow-y: auto; padding: 8px 16px 24px; max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.run-foot { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.run-foot > * { max-width: 720px; margin: 0 auto; }
.q { font-family: var(--font-display); font-variation-settings: "wdth" 108; font-weight: 800; font-size: 1.3rem; text-wrap: balance; }
.prompt { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.prompt .en { font-size: 1.2rem; font-weight: 600; }
.prompt .pt { font-size: 1.15rem; font-weight: 600; }
.listen { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px; font-weight: 500; min-height: 54px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.ans { min-height: 72px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; align-content: flex-start; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { background: var(--surface); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 10px; padding: 9px 13px; font-weight: 600; min-height: 44px; }
.tok.ghost { background: var(--surface-2); color: transparent; border-style: dashed; user-select: none; }
.fb { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.fb > div { flex: 1; min-width: 200px; }
.fb strong { display: block; font-size: 1.05rem; }
.fb.ok strong { color: var(--good); }
.fb.bad strong { color: var(--bad); }
.fb span { color: var(--muted); font-size: .92rem; }
.learn { display: flex; flex-direction: column; gap: 10px; }
.learn .prompt { align-items: flex-start; }
.learn .en { font-weight: 700; }
.learn .pt { color: var(--muted); font-size: .98rem; font-weight: 500; }
.bubble { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.bubble > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bubble .en { font-size: 1.15rem; font-weight: 600; }
.bubble .pt { color: var(--muted); }
.result { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 24px; }
.stars { font-family: var(--font-display); font-size: 2.6rem; color: var(--xp); letter-spacing: .15em; }
.result .big { font-family: var(--font-display); font-variation-settings: "wdth" 115; font-weight: 800; font-size: 2rem; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  DIALOGS.forEach(function (d) {
    var s = S.dlg[d.id] || 0, st = "";
    for (var i = 0; i < 5; i++) st += i < s ? "★" : "☆";
    h += '<section class="card"><div class="unit-head"><h3 class="sec-title" style="font-size:1.1rem">' + esc(d.title) + '</h3><span class="tag" aria-label="' + s + ' de 5">' + st + '</span></div><p class="sub">' + esc(d.sub) + '</p><button class="btn" data-act="dlg" data-id="' + d.id + '">' + (S.dlg[d.id] != null ? "Jogar de novo" : "Começar conversa") + "</button></section>";
  });
  return h;
}
function vMedia() {
  var h = '<div class="stack"><h2 class="sec-title">Séries e músicas</h2><p class="sub">Elas ensinam o ritmo do inglês falado. Os links abrem buscas com trechos e letras para você usar com as legendas em inglês.</p></div>';
  h += '<section class="card"><h3 class="sec-title" style="font-size:1.05rem">Como estudar com qualquer vídeo</h3><ol class="steps"><li>Assista uma vez sem legenda e tente pegar o assunto.</li><li>Assista de novo com legenda em inglês.</li><li>Escolha 5 frases úteis e repita em voz alta, imitando o ritmo.</li><li>Escreva uma frase sua usando uma delas.</li></ol></section>';
  h += '<section class="card"><h3 class="sec-title" style="font-size:1.05rem">Séries, programas e podcasts</h3>' + SHOWS.map(function (s) {
    return '<div class="item"><div class="item-h"><h3>' + esc(s.t) + '</h3><span class="tag">' + s.lv + '</span></div><p class="sub">' + esc(s.d) + '</p><a class="link" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(s.q) + '" target="_blank" rel="noopener">Buscar trechos no YouTube</a></div>';
  }).join("") + "</section>";
  h += '<section class="card"><h3 class="sec-title" style="font-size:1.05rem">Músicas</h3>' + SONGS.map(function (s) {
    return '<div class="item"><div class="item-h"><h3>' + esc(s.t) + '</h3><span class="tag">' + s.lv + '</span></div><p class="sub">' + esc(s.d) + '</p><a class="link" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(s.t + " lyrics") + '" target="_blank" rel="noopener">Buscar música com letra</a></div>';
  }).join("") + "</section>";
  h += '<section class="card"><h3 class="sec-title" style="font-size:1.05rem">Rotina da semana</h3><p class="sub">Marque o que fez. Cada item vale 10 XP. A lista zera toda segunda-feira.</p>' + CHECKS.map(function (c, i) {
    return '<div class="check"><input type="checkbox" id="chk' + i + '" data-act="chk" data-i="' + i + '"' + (S.checks[i] ? " checked" : "") + '><label for="chk' + i + '">' + esc(c) + "</label></div>";
  }).join("") + "</section>";
  return h;
}
function vGlossary() {
  return '<div class="stack"><h2 class="sec-title">Frases de bolso</h2><p class="sub">Todas as frases do jogo, para ouvir e consultar na feira. Busque em inglês ou português.</p></div><input class="search" id="q" type="search" placeholder="Buscar, por exemplo: desconto, sample, MOQ" aria-label="Buscar frases"><section class="card" id="glist"></section>';
}
function glist(term) {
  term = (term || "").toLowerCase().trim();
  var out = "";
  UNITS.forEach(function (u) {
    u.phrases.forEach(function (p) {
      if (term && (p[0] + " " + p[1]).toLowerCase().indexOf(term) < 0) return;
      out += '<div class="phrase"><button class="spk" data-act="say" data-say="' + esc(p[0]) + '" aria-label="Ouvir">' + ICON + '</button><div><p class="en">' + esc(p[0]) + '</p><p class="pt">' + esc(p[1]) + '</p><p class="u mono">' + esc(u.title) + "</p></div></div>";
    });
  });
  $("#glist").innerHTML = out || '<p class="sub">Nenhuma frase encontrada. Tente outra palavra.</p>';
}
var TABS = [["missions", "Missões"], ["dialogs", "Conversas"], ["media", "Mídia"], ["gloss", "Frases"]];
function render() {
  var v = tab === "missions" ? vMissions() : tab === "dialogs" ? vDialogs() : tab === "media" ? vMedia() : vGlossary();
  $("#app").innerHTML = headerHTML() + v;
  $("#tabs").innerHTML = TABS.map(function (t) { return '<button class="tab" data-act="tab" data-t="' + t[0] + '"' + (t[0] === tab ? ' aria-current="page"' : "") + ">" + t[1] + "</button>"; }).join("");
  if (tab === "gloss") glist("");
}

/* ---------- Eventos ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]"); if (!t) return;
  var a = t.dataset.act, d = t.dataset;
  if (a === "tab") { tab = d.t; render(); window.scrollTo(0, 0); }
  else if (a === "say") speak(d.say, d.slow === "1");
  else if (a === "lesson") { var u = UNITS[+d.u]; startRun({ kind: "lesson", ref: { u: u.id, i: +d.i }, q: lessonQueue(u, +d.i) }); }
  else if (a === "nums") startRun({ kind: "nums", q: numQueue(d.mode) });
  else if (a === "dlg") { var dl = DIALOGS.filter(function (x) { return x.id === d.id; })[0]; startRun({ kind: "dlg", ref: dl.id, q: dlgQueue(dl) }); }
  else if (a === "quit") closeRun();
  else if (a === "next") { if (run) { run.i++; step(); } }
  else if (a === "opt") onOpt(+d.i);
  else if (a === "tok") { var ex = run.q[run.i]; ex.sel.push(+d.i); rBuild(ex); }
  else if (a === "untok") { var ex2 = run.q[run.i]; ex2.sel = ex2.sel.filter(function (i) { return i !== +d.i; }); rBuild(ex2); }
  else if (a === "check") onCheck();
  else if (a === "reveal") { var tr = $("#tr"); if (tr) { tr.hidden = false; t.hidden = true; } }
  else if (a === "chk") {
    var i = +d.i;
    if (t.checked && !S.checks[i]) { S.xp += 10; touch(); }
    S.checks[i] = t.checked; save();
    var h = $(".badge"); if (h) h.outerHTML = headerHTML();
  }
});
document.addEventListener("input", function (e) { if (e.target && e.target.id === "q") glist(e.target.value); });

render();
})();
</script>
